{% extends "base.html" %}
{% block title %}概要 — Meshi Archive{% endblock %}
{% block content %}
<h1 class="admin-page-title">概要</h1>
<section class="admin-summary" aria-label="確認が必要な登録内容">
  <div><h2 class="admin-section-title">未確認の登録内容</h2><p class="admin-summary-count"><strong>{{ counters.unresolved }}</strong> 件</p></div>
  <a class="btn btn-primary" href="/admin/review">登録内容を確認</a>
</section>
{% if read_only %}<p class="alert alert-warning" role="status">現在は読取専用です。変更はできません。</p>{% endif %}
<div id="admin-intake-config" data-read-only="{{ 'true' if read_only else 'false' }}" hidden></div>
<section class="admin-intake" aria-labelledby="intake-title">
  <h2 id="intake-title" class="admin-intake-title">登録できなかった投稿</h2>
  <div id="intake-posts" role="list" aria-live="polite" aria-busy="true"></div>
  <p id="intake-loading" class="small text-body-secondary" role="status">読み込み中…</p>
  <p id="intake-empty" class="text-body-secondary" hidden>対応が必要な投稿はありません。</p>
  <p id="intake-error" class="text-danger" role="alert" hidden></p>
  <button id="intake-load" type="button" class="btn btn-outline-secondary" hidden>再試行</button>
</section>
<script src="/static/js/admin-overview.js?v=2"></script>
{% endblock %}
