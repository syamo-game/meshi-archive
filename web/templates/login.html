{% extends "base.html" %}

{% block title %}ログイン — Meshi Archive{% endblock %}

{% block content %}
<div class="auth-layout mx-auto py-3 py-sm-4">
  <div class="card shadow-sm p-3 p-sm-4">
    <h1 class="h4 mb-3">ログイン</h1>
    <p class="text-body-secondary mb-4">このページにアクセスするにはパスワードが必要です。</p>

    {% if error %}
    <div id="login-error" class="alert alert-danger" role="alert">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3">
        <label for="password" class="form-label">パスワード</label>
        <input
          id="password"
          type="password"
          name="password"
          class="form-control{% if error %} is-invalid{% endif %}"
          {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}
          placeholder="パスワードを入力してください"
          autocomplete="current-password"
          required
          autofocus>
      </div>
      <button type="submit" class="btn btn-primary w-100">ログイン</button>
    </form>

    {% if discord_login_enabled %}
    <div class="auth-divider text-body-secondary small my-3"><span>または</span></div>
    <a href="/auth/discord" class="btn btn-outline-secondary w-100 gap-2">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.331c-1.182 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.974 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
      </svg>
      Discord でログイン
    </a>
    {% endif %}
  </div>
</div>
{% endblock %}
